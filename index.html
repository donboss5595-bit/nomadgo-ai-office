
<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NomadGO AI Office</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1020;color:white;font-family:Arial,sans-serif}
header{padding:20px;background:#151d35;border-bottom:1px solid #303b55}
h1{margin:0;font-size:23px}
small{color:#94a3b8}
main{max-width:1050px;margin:auto;padding:20px}
.office{background:#202d49;border:5px solid #435779;border-radius:15px;padding:30px 15px;text-align:center}
.staff{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:25px}
.person{background:#344563;padding:20px 5px;border-radius:10px;cursor:pointer}
.person:hover{background:#465d85}
.avatar{font-size:40px;margin-bottom:10px}
.chat{margin-top:25px;background:#151d35;border-radius:12px;padding:18px}
#messages{height:260px;overflow:auto;background:#0b1020;padding:15px;border-radius:8px}
.msg{margin:10px 0;padding:10px;background:#283955;border-radius:8px;white-space:pre-wrap}
.me{background:#164e63}
.controls{display:flex;gap:8px;margin-top:12px}
input{flex:1;min-width:0;padding:13px;border:0;border-radius:7px}
button{padding:12px;border:0;border-radius:7px;background:#38bdf8;cursor:pointer}
@media(max-width:600px){.staff{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<header>
<h1>🏢 NomadGO AI Office</h1>
<small>Виртуалды AI команда</small>
</header>
<main>
<h2>Қош келдің, Даник!</h2>
<section class="office">
<h2>🏢 NOMADGO OFFICE</h2>
<div class="staff" id="staff"></div>
</section>
<section class="chat">
<h2 id="agentName">🤖 Ассар</h2>
<div id="messages"></div>
<div class="controls">
<input id="message" placeholder="Хабарлама жаз...">
<button onclick="send()">Жіберу</button>
</div>
</section>
</main>
<script>
const agents=[
{id:"assar",name:"Ассар",emoji:"🤖",role:"Бас AI"},
{id:"analyst",name:"Аналитик",emoji:"📊",role:"Статистика"},
{id:"dispatcher",name:"Диспетчер",emoji:"🚕",role:"Тапсырыстар"},
{id:"marketer",name:"Маркетолог",emoji:"📣",role:"Маркетинг"}
];
let current=agents[0];
const histories={};
const staff=document.getElementById("staff");
const messages=document.getElementById("messages");
const input=document.getElementById("message");

function addMessage(text,who){
const div=document.createElement("div");
div.className="msg "+(who==="me"?"me":"");
div.textContent=text;
messages.appendChild(div);
messages.scrollTop=messages.scrollHeight;
}

function selectAgent(id){
current=agents.find(a=>a.id===id);
document.getElementById("agentName").textContent=
current.emoji+" "+current.name;
messages.replaceChildren();
(histories[id]||[]).forEach(m=>
addMessage(m.text,m.who));
if(!histories[id]){
addMessage("Сәлем, Даник! Мен "+current.name+".","bot");
}
}

agents.forEach(a=>{
const el=document.createElement("div");
el.className="person";
el.innerHTML='<div class="avatar">'+a.emoji+
'</div><b>'+a.name+'</b><p>'+a.role+'</p>';
el.onclick=()=>selectAgent(a.id);
staff.appendChild(el);
});

async function send(){
const text=input.value.trim();
if(!text)return;
input.value="";
const agent=current;
const id=agent.id;
(histories[id]??=[]).push({who:"me",text});
addMessage(text,"me");
try{
const res=await fetch("/api/chat",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
agent:id,
messages:histories[id].map(m=>({
role:m.who==="me"?"user":"assistant",
content:m.text
}))
})
});
const data=await res.json();
if(!res.ok)throw Error(data.error||"API қатесі");
const reply=data.reply||"Жауап жоқ";
histories[id].push({who:"bot",text:reply});
if(current.id===id)addMessage(reply,"bot");
}catch(e){
if(current.id===id)
addMessage("AI әлі қосылмаған: "+e.message,"bot");
}
}
input.addEventListener("keydown",e=>{
if(e.key==="Enter")send();
});
selectAgent("assar");
</script>
</body>
</html>
